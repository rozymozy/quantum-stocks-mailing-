name: Weekly Quantum Computing Digest

on:
  schedule:
    # Runs every Monday at 08:00 UTC. Adjust the hour if you want a
    # different local time — GitHub cron is always UTC.
    - cron: '0 8 * * 1'
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab

permissions:
  contents: write   # needed so the workflow can commit the digest back to the repo

jobs:
  run-digest:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run digest script
        run: python quantum_news_digest.py
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}

      - name: Upload digest as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: quantum-digest
          path: quantum_digest_*.html

      - name: Commit digest into repo (optional history log)
        run: |
          git config user.name "quantum-digest-bot"
          git config user.email "actions@github.com"
          git add quantum_digest_*.html
          git commit -m "Weekly quantum digest $(date +'%Y-%m-%d')" || echo "No changes to commit"
          git push
